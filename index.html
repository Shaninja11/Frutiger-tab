<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Start Page</title>
    </head>
    <body id="body">
        <main>
            <div class="searchbox">
                <form onsubmit="search()">
                    <input style=" width: 50vw; font-size: 40px;" type="text" class="inputField" id="inputField" placeholder="Search">
                </form>
                <select style="width: 10vw; font-size: 20px; margin-top: 5px; margin-left: 10px;" class="inputField" name="prov" id="chooseprov">
                    <option value="1">Ecosia</option>
                    <option value="2">Startpage</option>
                    <option value="3">Brave</option>
                    <option value="4">Qwant</option>
                </select>
            </div>
            <div class="shortcuts">
                <div class="shortbox">
                    <button class="shorts" onclick="shortcut(1)" id="short1">Shortcut 1</button>
                    <button class="editshort" onclick="editshort(1)">...</button>
                </div>
                <div class="shortbox">
                    <button class="shorts" onclick="shortcut(2)" id="short2">Shortcut 2</button>
                    <button class="editshort" onclick="editshort(2)">...</button>
                </div>
                <div class="shortbox">
                    <button class="shorts" onclick="shortcut(3)" id="short3">Shortcut 3</button>
                    <button class="editshort" onclick="editshort(3)">...</button>
                </div>
                <div class="shortbox">
                    <button class="shorts" onclick="shortcut(4)" id="short4">Shortcut 4</button>
                    <button class="editshort" onclick="editshort(4)">...</button>
                </div>
            </div>
            <div class="setshort" id="shortmenu">
                <p id="warning" class="warning"></p>
                <label for="label">Label</label>
                <input class="shortfiller" name="label" type="text" id="label" placeholder="name"/>
                <label for="link">URL</label>
                <input class="shortfiller" name="link" type="url" value="https://" id="link" />
                <input class="shortfiller" onclick="AddShortcut()" type="button" id="btn" value="Update" />
            </div>
            <button class="wallbtn" onclick="showwall()">Edit Wallpaper</button>
            <div class="editwall" id="editwall">
                <button style="background: url(./Wallpapers/Blue.jpg); background-size: cover;" class="choosewall" onclick="choosewall('./Wallpapers/Blue.jpg')"></button>
                <button style="background: url(./Wallpapers/Green.jpg); background-size: cover;" class="choosewall" onclick="choosewall('./Wallpapers/Green.jpg')"></button>
                <button style="background: url(./Wallpapers/Orange.jpg); background-size: cover;" class="choosewall" onclick="choosewall('./Wallpapers/Orange.jpg')"></button>
                <button style="background: url(./Wallpapers/Trees.jpg); background-size: cover;" class="choosewall" onclick="choosewall('./Wallpapers/Trees.jpg')"></button>
                <button class="choosewall" onclick="nasa()">Nasa (WIP)</button>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
