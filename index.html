<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Start Page</title>
    </head>
    <body>
        <main>
            <div class="searchbox">
                <form onsubmit="search()">
                    <input style="font-size: 40px;" type="text" class="inputField" id="inputField" placeholder="Search">
                </form>
                <label for="chooseprov">Provider:</label>
                <select style="height: 30px; font-size: 20px; margin-top: 15px;" class="inputField" name="prov" id="chooseprov">
                    <option value="1">Ecosia</option>
                    <option value="2">Startpage</option>
                    <option value="3">Brave Search</option>
                    <option value="4">Qwant</option>
                </select>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
